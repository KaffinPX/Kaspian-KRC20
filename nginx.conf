server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;  # Hide nginx version in responses
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: try index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
